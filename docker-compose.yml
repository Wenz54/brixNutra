  # Next.js Admin Panel (после создания admin проекта)
  # Раскомментировать после создания admin/
  # admin:
  #   build:
  #     context: ./admin
  #     dockerfile: Dockerfile.dev
  #   container_name: brix_admin
  #   restart: unless-stopped
