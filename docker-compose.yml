  #     # API URL
  #     NEXT_PUBLIC_API_URL: http://strapi:1337/api
  #     # Node
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./admin:/app
  #     - /app/node_modules
