  #   networks:
  #     - brix_network
  #   depends_on:
  #     - strapi
  #   command: npm run dev

  # PgAdmin (для управления PostgreSQL через UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: brix_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brix-nutrition.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - brix_network
    depends_on:
      - postgres

  # Redis Commander (для управления Redis через UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: brix_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - brix_network
    depends_on:
      - redis

  # Mailhog (для тестирования email отправки)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: brix_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - brix_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  strapi_uploads:
    driver: local

networks:
  brix_network:
    driver: bridge

